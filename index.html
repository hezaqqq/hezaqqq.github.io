<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prochains métros</title>
<link rel="icon" type="image/svg+xml" href="logos/logo_metro.svg">
<style>

  @font-face {
    font-family: "Parisine";
    src: url("fonts/Parisine%20Bold.otf") format("opentype");
    font-weight: 700;
  }

  * {
    box-sizing: border-box;
    margin: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Parisine", Arial, sans-serif;
    font-weight: 700;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  img {
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #q {
    -webkit-user-select: text;
    user-select: text;
  }

  .hidden {
    display: none !important;
  }

  .screen {
    position: fixed;
    inset: 0;
    height: 100dvh;
    background: #fff;
    color: #08007C;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    padding: 20px;
  }

  .screen h1 {
    font-size: clamp(28px, 6vw, 52px);
  }

  #lignes,
  #lignes2 {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 980px;
    padding: 10px 6px;
  }

  #lignes2 {
    justify-content: center;
    margin-top: -2vh;
  }

  #lignes2 .ligne {
    flex: 0 1 calc((100% - 180px) / 16);
    border-radius: 18%;
    overflow: visible;
  }

  .ligne {
    flex: 1 1 0;
    min-width: 0;
    max-width: 64px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    padding: 0;
    font: inherit;
    font-size: clamp(11px, 2.6vw, 26px);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: .4;
    transition: transform .15s, opacity .15s;
    overflow: hidden;
    background: none;
  }

  .ligne img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .ligne.on {
    opacity: 1;
    transform: scale(1.2);
  }

  .ligne:focus-visible {
    outline: 3px solid #08007C;
    outline-offset: 3px;
    opacity: 1;
  }

  @media (hover: hover) {
    .ligne:hover {
      opacity: 1;
      transform: scale(1.14);
    }
    .ligne.on:hover {
      transform: scale(1.28);
    }
  }

  #q {
    width: min(100%, 560px);
    font: inherit;
    font-size: 22px;
    color: #08007C;
    border: 3px solid #08007C;
    border-radius: 40px;
    padding: 14px 22px;
    outline: none;
    background: #fff;
  }

  #q::placeholder {
    color: #08007C;
    opacity: .45;
  }

  #q:focus-visible {
    box-shadow: 0 0 0 4px #08007C33;
  }

  #res {
    width: min(100%, 560px);
    height: 32vh;
    overflow-y: auto;
    list-style: none;
    padding: 0;
  }

  #res li {
    padding: 12px 22px;
    font-size: 20px;
    cursor: pointer;
    border-bottom: 1px solid #08007C22;
  }

  #res li:hover,
  #res li:focus-visible {
    background: #08007C12;
    outline: none;
  }

  #res .info {
    opacity: .5;
    cursor: default;
  }

  #dlist {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(100%, 560px);
  }

  .btn {
    font: inherit;
    font-size: clamp(20px, 4vw, 30px);
    color: #08007C;
    background: #fff;
    border: 3px solid #08007C;
    border-radius: 40px;
    padding: 16px 24px;
    cursor: pointer;
  }

  .btn:hover,
  .btn:focus-visible {
    background: #08007C;
    color: #fff;
    outline: none;
  }

  .btn.ghost {
    border-color: transparent;
    font-size: 18px;
    opacity: .6;
  }

  #dmsg {
    opacity: .6;
    font-size: 20px;
    text-align: center;
  }

  #board {
    position: fixed;
    inset: 0;
    height: 100dvh;
    display: grid;
    grid-template-rows: 22% 1fr 6%;
    background: #000;
    color: #fff;
  }

  #head {
    background: #f5f5f5;
    color: #000;
    display: flex;
    align-items: center;
    gap: 2.2vh;
    padding: 0 3vw;
    min-width: 0;
  }

  #head .logos {
    display: flex;
    align-items: center;
    gap: 1.2vh;
    height: 70%;
    flex: 0 0 auto;
  }

  .rond {
    height: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 4.6vh;
    overflow: hidden;
  }

  .rond.m {
    border: .7vh solid #000;
    background: #fff;
    color: #000;
  }

  .rond.sq {
    border-radius: 18%;
    overflow: visible;
  }

  .rond img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  #dir {
    font-size: clamp(26px, 8vh, 90px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: none;
    border: none;
    font-family: inherit;
    font-weight: inherit;
    color: inherit;
    text-align: left;
    min-width: 0;
  }

  #mid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 0 3vw;
  }

  .col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2vh;
    padding-left: 2vw;
    position: relative;
  }

  .col + .col::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: 25%;
    height: 50%;
    width: .7vh;
    background: #fff;
    border-radius: 1vh;
  }

  .lab {
    font-size: clamp(14px, 3.2vh, 34px);
  }

  .lab sup {
    font-size: .6em;
  }

  .val {
    display: flex;
    align-items: center;
    min-height: 30vh;
    font-size: clamp(90px, 32vh, 420px);
    line-height: 1;
    color: #ffd04a;
  }

  #bar {
    background: var(--c);
  }

  #ctrl {
    position: fixed;
    right: 12px;
    top: 12px;
    display: flex;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }

  #ctrl.show {
    opacity: 1;
    pointer-events: auto;
  }

  #ctrl button {
    background: #000a;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  #ctrl button:hover,
  #ctrl button:focus-visible {
    background: #000;
    outline: none;
  }

  body.idle #board {
    cursor: none;
  }
</style>
</head>
<body>

<div id="menu" class="screen">
  <h1>Ton arrêt</h1>
  <div id="lignes" role="listbox" aria-label="Ligne"></div>
  <div id="lignes2" role="listbox" aria-label="RER et Transilien"></div>
  <input id="q" type="search" placeholder="Rechercher une station" autocomplete="off">
  <ul id="res"></ul>
</div>

<div id="dirs" class="screen hidden">
  <h1>Direction</h1>
  <div id="dmsg">Chargement…</div>
  <div id="dlist"></div>
  <button class="btn ghost" id="dback">Changer d’arrêt</button>
</div>

<div id="board" class="hidden">
  <div id="head">
    <div class="logos">
      <div class="rond m" id="lm">M</div>
      <div class="rond" id="ll"></div>
    </div>
    <div id="dir"></div>
  </div>
  <div id="mid">
    <div class="col">
      <div class="lab" id="l1">1<sup>er</sup> métro</div>
      <div class="val" id="v1"></div>
    </div>
    <div class="col">
      <div class="lab" id="l2">2<sup>e</sup> métro</div>
      <div class="val" id="v2"></div>
    </div>
  </div>
  <div id="bar"></div>
  <div id="ctrl">
    <button id="chdir">Changer de direction</button>
    <button id="back">Changer d’arrêt</button>
  </div>
</div>

<script>
  const LOCAL = ["", "localhost", "127.0.0.1"].includes(location.hostname);
  const WORKER_URL = LOCAL ? "http://localhost:8787" : "https://hezaqqq.prochains-metros.workers.dev";

  const LIGNES = {
    "1": "#FFCE00", "2": "#0064B0", "3": "#9F9825", "3bis": "#98D4E2", "4": "#C04191", "5": "#F28E42",
    "6": "#83C491", "7": "#F3A4BA", "7bis": "#83C491", "8": "#CEADD2", "9": "#D5C900", "10": "#E3B32A",
    "11": "#8D5E2A", "12": "#00814F", "13": "#98D4E2", "14": "#662483",
    "A": "#E3051C", "B": "#5291CE", "C": "#FFCE00", "D": "#00814F", "E": "#C04191",
    "H": "#8D5E2A", "J": "#D5C900", "K": "#9F9825", "L": "#CEADD2", "N": "#00A88F",
    "P": "#F28E42", "R": "#F3A4BA", "U": "#B90845", "V": "#9F9825"
  };
  const ORDRE = ["1", "2", "3", "3bis", "4", "5", "6", "7", "7bis", "8", "9", "10", "11", "12", "13", "14"];
  const ORDRE2 = ["A", "B", "C", "D", "E", "H", "J", "K", "L", "N", "P", "R", "U", "V"];
  const SOMBRES = ["2", "11", "12", "14", "A", "B", "D", "E", "H", "K", "N", "U", "V"];
  const KIND = {};
  ORDRE.forEach(l => KIND[l] = "metro");
  ORDRE2.forEach(l => KIND[l] = ["A", "B", "C", "D", "E"].includes(l) ? "rer" : "transilien");
  const MOT = {metro: "métro", rer: "train", transilien: "train"};
  const MARQUE = {metro: "M", rer: "RER", transilien: "T"};
  const DATA = "https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/arrets-lignes/exports/json";
  

  const $ = id => document.getElementById(id);
  const show = id => ["menu", "dirs", "board"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  const REFRESH_MS = 15000;
  let busy = false, hideT = null;
  let ligne = "10", stations = [], station = null, curDest = null, passages = [], timer = null;

  function pastille(el, l) {
    el.style.background = LIGNES[l];
    el.style.color = SOMBRES.includes(l) ? "#fff" : "#000";
    el.textContent = l.replace("bis", "b");
  }

  function logoLigne(el, l) {
    el.innerHTML = "";
    el.style.background = "";
    el.style.color = "";
    const img = new Image();
    img.alt = l;
    img.onload = () => el.appendChild(img);
    img.onerror = () => pastille(el, l);
    img.src = `logos/ligne_${l}.svg`;
  }

  let logoTok = 0;
  function logoMode(kind) {
    const e = $("lm"), tok = ++logoTok;
    const sq = kind === "metro" ? "" : " sq";
    e.className = "rond m" + sq;
    e.style.background = "";
    e.textContent = MARQUE[kind];
    const img = new Image();
    img.onload = () => {
      if (tok !== logoTok) return;
      e.className = "rond" + sq;
      e.style.background = "none";
      e.innerHTML = "";
      e.appendChild(img);
    };
    img.src = `logos/logo_${kind}.svg`;
  }

  function buildLignes() {
    [["lignes", ORDRE], ["lignes2", ORDRE2]].forEach(([id, list]) => {
      const box = $(id);
      list.forEach(l => {
        const b = document.createElement("button");
        b.className = "ligne" + (l === ligne ? " on" : "");
        b.setAttribute("role", "option");
        b.setAttribute("aria-label", (KIND[l] === "rer" ? "RER " : "Ligne ") + l);
        logoLigne(b, l);
        b.onclick = () => {
          ligne = l;
          document.querySelectorAll(".ligne").forEach(c => c.classList.toggle("on", c === b));
          loadStations();
        };
        box.appendChild(b);
      });
    });
  }

  let loadTok = 0;

  async function getRows(where, select) {
    const q = select ? {select, where} : {where};
    const d = await (await fetch(DATA + "?" + new URLSearchParams(q))).json();
    if (Array.isArray(d)) return d;
    console.warn("[stations] réponse inattendue", where, d);
    return null;
  }

  async function loadStations() {
    const tok = ++loadTok, kind = KIND[ligne];
    stations = [];
    $("res").innerHTML = '<li class="info">Chargement…</li>';
    const sn = ligne === "3bis" ? '"3B","3BIS"' : ligne === "7bis" ? '"7B","7BIS"' : `"${ligne}"`;
    let list = [];
    try {
      let rows = [];
      if (kind === "metro") {
        for (const mode of ["Metro", "Métro"]) {
          rows = (await getRows(`mode="${mode}" and shortname in (${sn})`, "stop_id,stop_name")) || [];
          if (rows.length) break;
        }
      } else {
        // RER / Transilien : zones d'arrêt "IDFM:monomodalStopPlace:XXXX"
        const where = `shortname in (${sn})`;
        rows = (await getRows(where)) || [];
        if (rows.length) console.info("[stations] champs disponibles :", Object.keys(rows[0]).join(", "));
        rows = rows.filter(r => String(r.stop_id).includes("monomodalStopPlace"));
        if (!rows.length) {
          for (const mode of ["Rail", "rail"]) {
            rows = (await getRows(`mode="${mode}" and shortname in (${sn})`, "stop_id,stop_name")) || [];
            if (rows.length) break;
          }
        }
      }
      if (!rows.length) console.warn("[stations] aucune station trouvée pour", ligne);
      const m = {};
      rows.forEach(r => {
        const n = r.stop_name.trim();
        const e = (m[n] = m[n] || {ids: new Set(), lids: new Set()});
        e.ids.add(String(r.stop_id).split(":").pop());
        const lid = Object.values(r).find(v => /^IDFM:C\d{5}$/.test(String(v)));
        if (lid) e.lids.add(String(lid).split(":").pop());
      });
      list = Object.keys(m).sort((a, b) => a.localeCompare(b, "fr")).map(n => ({name: n, ids: [...m[n].ids], lids: [...m[n].lids], kind}));
    } catch (e) {
      console.warn("[stations] erreur", e);
      list = [];
    }
    if (tok !== loadTok) return;
    stations = list;
    renderResults();
  }

  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  function renderResults() {
    const q = norm($("q").value.trim()), ul = $("res");
    ul.innerHTML = "";
    const list = stations.filter(s => norm(s.name).includes(q)).slice(0, 60);
    if (!list.length) { 
      ul.innerHTML = '<li class="info">Aucune station trouvée</li>'; 
      return; 
    }
    list.forEach(s => {
      const li = document.createElement("li");
      li.tabIndex = 0;
      li.textContent = s.name;
      li.onclick = () => chooseStation(s);
      li.onkeydown = e => { if (e.key === "Enter") chooseStation(s); };
      ul.appendChild(li);
    });
  }

  async function fetchPassages() {
    const pre = (station.kind || "metro") === "metro" ? "STIF:StopPoint:Q:" : "STIF:StopArea:SP:";
    const all = await Promise.all(station.ids.slice(0, 4).map(async id => {
      const ref = encodeURIComponent(`${pre}${id}:`);
      const r = await fetch(`${WORKER_URL}?MonitoringRef=${ref}`);
      const d = await r.json();
      return d.Siri.ServiceDelivery.StopMonitoringDelivery[0].MonitoredStopVisit || [];
    }));
    const lids = station.lids || [];
    return all.flat().filter(v => {
      if (!lids.length) return true;
      const lr = v.MonitoredVehicleJourney?.LineRef?.value || "";
      return lids.some(x => lr.includes(x));
    }).map(v => {
      const j = v.MonitoredVehicleJourney, c = j.MonitoredCall || {};
      const t = c.ExpectedDepartureTime || c.ExpectedArrivalTime || c.AimedDepartureTime || c.AimedArrivalTime;
      const dest = j.DestinationName?.[0]?.value || j.DirectionName?.[0]?.value || "";
      return {t: new Date(t).getTime(), dest, off: c.DepartureStatus === "cancelled"};
    }).filter(p => p.t && !p.off).sort((a, b) => a.t - b.t);
  }

  async function chooseStation(s) {
    station = s; curDest = null; passages = [];
    clearInterval(timer);
    show("dirs");
    $("dmsg").textContent = "Chargement…";
    $("dmsg").classList.remove("hidden");
    $("dlist").innerHTML = "";
    try {
      passages = await fetchPassages();
      const dests = [...new Set(passages.map(p => p.dest).filter(Boolean))];
      if (!dests.length) { 
        $("dmsg").textContent = "Aucun passage prévu pour le moment."; 
        addBtn("Afficher quand même", () => openBoard(null)); 
        return; 
      }
      $("dmsg").classList.add("hidden");
      dests.forEach(d => addBtn(d, () => openBoard(d)));
    } catch (e) {
      $("dmsg").textContent = "Impossible de récupérer les horaires.";
      addBtn("Réessayer", () => chooseStation(s));
    }
  }

  function addBtn(txt, fn) {
    const b = document.createElement("button");
    b.className = "btn"; 
    b.textContent = txt; 
    b.onclick = fn;
    $("dlist").appendChild(b);
  }

  function openBoard(dest) {
    curDest = dest;
    $("board").style.setProperty("--c", LIGNES[ligne]);
    const mot = MOT[KIND[ligne]];
    $("l1").innerHTML = "1<sup>er</sup> " + mot;
    $("l2").innerHTML = "2<sup>e</sup> " + mot;
    logoMode(KIND[ligne]);
    $("ll").className = "rond" + (KIND[ligne] === "metro" ? "" : " sq");
    logoLigne($("ll"), ligne);
    show("board");
    render();
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, REFRESH_MS);
    wake();
  }

  async function refresh() {
    if (busy || document.hidden) return;
    busy = true;
    try { passages = await fetchPassages(); } catch (e) {}
    busy = false;
    render();
  }

  function wake() {
    if ($("board").classList.contains("hidden")) return;
    $("ctrl").classList.add("show");
    document.body.classList.remove("idle");
    clearTimeout(hideT);
    hideT = setTimeout(() => {
      $("ctrl").classList.remove("show");
      document.body.classList.add("idle");
    }, 3000);
  }

  function render() {
    $("dir").textContent = curDest || station.name;
    const mine = passages.filter(p => !curDest || p.dest === curDest).slice(0, 2);
    [0, 1].forEach(i => {
      const p = mine[i];
      $("v" + (i + 1)).textContent = p ? Math.max(0, Math.floor((p.t - Date.now()) / 60000)) : "--";
    });
  }

  setInterval(() => !$("board").classList.contains("hidden") && render(), 15000);

  $("chdir").onclick = () => chooseStation(station);
  ["mousemove", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, wake, {passive: true}));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("board").classList.contains("hidden")) refresh(); });
  $("back").onclick = () => { clearInterval(timer); show("menu"); };
  $("dback").onclick = () => show("menu");
  $("q").addEventListener("input", renderResults);

  buildLignes();
  loadStations();
</script>
</body>
</html>
